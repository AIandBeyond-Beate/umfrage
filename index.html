<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Live-Umfrage</title>
<link rel="stylesheet" href="stil.css">
<style>
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  .rahmen { width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px 28px; flex: 1; display: flex; flex-direction: column; gap: 22px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .codechip { font-size: 13px; font-weight: 600; letter-spacing: .14em; color: var(--lav-300); border: 1px solid var(--glass-border); border-radius: 999px; padding: 6px 12px; }
  h1 { font-size: clamp(24px, 6.4vw, 32px); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .unter { font-size: 15px; color: var(--lav-300); margin-top: -10px; }
  .liste { display: flex; flex-direction: column; gap: 12px; }
  .wahl {
    width: 100%; text-align: left; min-height: 58px; padding: 14px 18px; border-radius: 12px; font-size: 18px; font-weight: 600; line-height: 1.3;
    background: var(--glass); border: 1.5px solid var(--glass-border); display: flex; align-items: center; gap: 14px; overflow-wrap: anywhere;
    transition: background .2s, border-color .2s, box-shadow .2s;
  }
  .wahl .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--lav-300); display: grid; place-items: center; }
  .wahl.eckig .mark { border-radius: 6px; }
  .wahl[aria-pressed="true"] { background: rgba(167,6,173,.55); border-color: var(--magenta-400); box-shadow: 0 0 22px rgba(225,75,232,.45); }
  .wahl[aria-pressed="true"] .mark { border-color: #fff; background: #fff; }
  .wahl[aria-pressed="true"] .mark::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--magenta-600); }
  .wahl.eckig[aria-pressed="true"] .mark::after { border-radius: 2px; }
  .skala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .skala .wahl { justify-content: center; text-align: center; font-size: 24px; font-weight: 700; padding: 0; min-height: 62px; }
  .skala .wahl .mark { display: none; }
  .enden { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--lav-300); }
  .enden span:last-child { text-align: right; }
  .woerter { display: flex; flex-direction: column; gap: 10px; }
  .zaehl { font-size: 12px; color: var(--lav-400); text-align: right; margin-top: 4px; }
  .aktion { position: sticky; bottom: 0; padding: 12px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--navy-900) 60%, transparent); }
  .aktion .knopf { width: 100%; min-height: 56px; font-size: 18px; }
  .mitte { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 24px 0; }
  .haken { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: rgba(167,6,173,.45); border: 3px solid var(--magenta-400); box-shadow: 0 0 34px rgba(225,75,232,.55); }
  .haken svg { width: 44px; height: 44px; }
  .mitte h2 { font-size: 26px; font-weight: 700; }
  .mitte p { color: var(--lav-200); font-size: 16px; line-height: 1.5; max-width: 34ch; }
  .codefeld { font-size: 32px; font-weight: 700; letter-spacing: .3em; text-align: center; text-transform: uppercase; max-width: 260px; }
  footer { text-align: center; font-size: 12.5px; color: var(--lav-400); line-height: 1.5; padding: 0 16px 18px; }
  .lade { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--magenta-400); animation: dreh 1s linear infinite; }
  @keyframes dreh { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .lade { animation-duration: 3s; } }
</style>
</head>
<body>
<div class="rahmen">
  <header>
    <img class="logo" src="lib/logo.png" alt="AI & Beyond">
    <span class="codechip versteckt" id="chip"></span>
  </header>
  <main id="inhalt" class="mitte"><div class="lade" aria-label="Wird geladen"></div></main>
</div>
<footer>Anonym. Es werden keine persönlichen Daten gespeichert, nur deine Antwort.</footer>

<script src="einstellungen.js"></script>
<script src="lib/qrcode.js"></script>
<script src="gemeinsam.js"></script>
<script>
(function () {
  'use strict';
  const U = window.Umfrage, el = U.el, inhalt = document.getElementById('inhalt'), chip = document.getElementById('chip');
  let code = (U.param('c') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  let umfrage = null, wartenTimer = null;
  const HAKEN = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const abgestimmt = () => U.speicher.lesen('umfrage_stimme_' + code, null);
  function leeren(mitte) { clearTimeout(wartenTimer); inhalt.textContent = ''; inhalt.className = mitte ? 'mitte' : ''; inhalt.style.display = mitte ? '' : 'flex'; inhalt.style.flexDirection = 'column'; inhalt.style.gap = '22px'; inhalt.style.flex = '1'; }
  function meldung(text, art) { const m = el('div', 'meldung ' + (art || 'fehler'), text); m.setAttribute('role', 'alert'); return m; }

  /* Code eingeben */
  function zeigeCodeEingabe(fehlerText) {
    leeren(true); chip.classList.add('versteckt');
    inhalt.append(el('h2', '', 'Live-Umfrage'), el('p', '', 'Gib den Code ein, der auf der Folie steht.'));
    const f = el('form'); f.style.cssText = 'display:flex;flex-direction:column;gap:14px;align-items:center;width:100%';
    const i = el('input', 'feld codefeld'); i.maxLength = 8; i.autocomplete = 'off'; i.autocapitalize = 'characters'; i.spellcheck = false; i.setAttribute('aria-label', 'Umfrage-Code'); i.placeholder = 'CODE';
    const b = el('button', 'knopf', 'Weiter'); b.type = 'submit'; b.style.minWidth = '200px';
    f.append(i, b); inhalt.append(f);
    if (fehlerText) inhalt.append(meldung(fehlerText));
    f.addEventListener('submit', (e) => { e.preventDefault(); const c = i.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!c) return; code = c; history.replaceState(null, '', '?c=' + c); laden(); });
    setTimeout(() => i.focus(), 50);
  }

  async function laden() {
    leeren(true); inhalt.append(el('div', 'lade'));
    try {
      umfrage = await U.api.laden(code);
      if (!umfrage) return zeigeCodeEingabe('Zu diesem Code gibt es keine Umfrage. Bitte prüfe die Schreibweise.');
      chip.textContent = 'Code ' + umfrage.code; chip.classList.remove('versteckt');
      const st = abgestimmt();
      if (!umfrage.offen) return zeigeGeschlossen();
      if (st && st.runde === umfrage.runde) return zeigeDanke();
      zeigeFrage(st && st.runde === umfrage.runde ? st.antwort : null);
    } catch (e) { leeren(true); inhalt.append(meldung(e.message)); const b = el('button', 'knopf zweit', 'Nochmal versuchen'); b.onclick = laden; inhalt.append(b); }
  }

  /* Frage anzeigen */
  function zeigeFrage(vorher) {
    leeren(false);
    const h = el('h1', '', umfrage.frage); inhalt.append(h);
    const typ = umfrage.typ; let wahl = new Set(vorher && typ !== 'wolke' ? vorher : []);
    const senden = el('button', 'knopf', 'Abstimmen'); senden.type = 'button';
    const fehlerBox = el('div');
    const pruefe = () => { senden.disabled = typ === 'wolke' ? !felder.some((f) => f.value.trim()) : wahl.size === 0; };
    let felder = [];

    if (typ === 'einfach' || typ === 'mehrfach') {
      inhalt.append(el('p', 'unter', typ === 'mehrfach' ? 'Mehrere Antworten möglich' : 'Eine Antwort wählen'));
      const l = el('div', 'liste'); l.setAttribute('role', typ === 'mehrfach' ? 'group' : 'radiogroup'); l.setAttribute('aria-label', umfrage.frage);
      umfrage.optionen.forEach((o, i) => {
        const b = el('button', 'wahl' + (typ === 'mehrfach' ? ' eckig' : '')); b.type = 'button';
        b.append(el('span', 'mark'), el('span', '', o)); b.setAttribute('aria-pressed', wahl.has(i) ? 'true' : 'false');
        b.onclick = () => {
          if (typ === 'einfach') { wahl = new Set([i]); l.querySelectorAll('.wahl').forEach((x) => x.setAttribute('aria-pressed', 'false')); }
          else if (wahl.has(i)) wahl.delete(i); else wahl.add(i);
          b.setAttribute('aria-pressed', wahl.has(i) ? 'true' : 'false'); pruefe();
        };
        l.append(b);
      });
      inhalt.append(l);
    } else if (typ === 'skala') {
      inhalt.append(el('p', 'unter', 'Wähle einen Wert von 1 bis 10'));
      const g = el('div', 'skala'); g.setAttribute('role', 'radiogroup'); g.setAttribute('aria-label', umfrage.frage);
      for (let k = 1; k <= 10; k++) {
        const b = el('button', 'wahl'); b.type = 'button'; b.append(el('span', 'mark'), el('span', '', String(k))); b.setAttribute('aria-pressed', wahl.has(k) ? 'true' : 'false');
        b.onclick = () => { wahl = new Set([k]); g.querySelectorAll('.wahl').forEach((x) => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); pruefe(); };
        g.append(b);
      }
      const e = el('div', 'enden'); e.append(el('span', '', '1 = ' + (umfrage.optionen[0] || '')), el('span', '', '10 = ' + (umfrage.optionen[1] || '')));
      inhalt.append(g, e);
    } else {
      inhalt.append(el('p', 'unter', 'Bis zu 3 Begriffe, je höchstens 30 Zeichen'));
      const w = el('div', 'woerter');
      for (let k = 0; k < 3; k++) {
        const box = el('div'); const i = el('input', 'feld'); i.maxLength = 30; i.placeholder = k === 0 ? 'Dein Begriff' : 'Optional'; i.setAttribute('aria-label', 'Begriff ' + (k + 1));
        if (vorher && vorher[k]) i.value = vorher[k];
        const z = el('div', 'zaehl', (i.value.length) + ' / 30'); i.oninput = () => { z.textContent = i.value.length + ' / 30'; pruefe(); };
        i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (!senden.disabled) senden.click(); } });
        box.append(i, z); w.append(box); felder.push(i);
      }
      inhalt.append(w);
    }
    inhalt.append(fehlerBox);
    const a = el('div', 'aktion'); a.append(senden); inhalt.append(a); pruefe();

    senden.onclick = async () => {
      fehlerBox.textContent = ''; senden.disabled = true; senden.textContent = 'Wird gesendet …';
      const antwort = typ === 'wolke' ? felder.map((f) => f.value.trim()).filter(Boolean) : [...wahl];
      try {
        const r = await U.api.abstimmen(code, antwort);
        U.speicher.schreiben('umfrage_stimme_' + code, { runde: r.runde, antwort });
        zeigeDanke();
      } catch (e) {
        fehlerBox.append(meldung(e.message)); senden.textContent = 'Abstimmen'; pruefe();
        if (/geschlossen/i.test(e.message)) setTimeout(laden, 1500);
      }
    };
  }

  /* Danke, warten auf neue Runde */
  function zeigeDanke() {
    leeren(true);
    const h = el('div', 'haken'); h.innerHTML = HAKEN;
    inhalt.append(h, el('h2', '', 'Danke, deine Stimme ist da!'), el('p', '', 'Das Ergebnis siehst du gleich auf der Folie.'));
    if (umfrage.offen) { const b = el('button', 'knopf zweit', 'Antwort ändern'); b.onclick = () => { const st = abgestimmt(); zeigeFrage(st ? st.antwort : null); }; inhalt.append(b); }
    warteAufAenderung();
  }
  function zeigeGeschlossen() {
    leeren(true);
    inhalt.append(el('h2', '', 'Die Umfrage ist gerade geschlossen.'), el('p', '', 'Sobald sie wieder öffnet, erscheint die Frage hier automatisch.'));
    warteAufAenderung();
  }
  function warteAufAenderung() {
    const alt = { offen: umfrage.offen, runde: umfrage.runde };
    const pruefen = async () => {
      if (document.hidden) { wartenTimer = setTimeout(pruefen, 4000); return; }
      try {
        const u = await U.api.laden(code);
        if (u && (u.offen !== alt.offen || u.runde !== alt.runde)) { laden(); return; }
      } catch (_) {}
      wartenTimer = setTimeout(pruefen, 4000);
    };
    wartenTimer = setTimeout(pruefen, 4000);
  }

  if (U.fehlerText) { leeren(true); inhalt.append(meldung(U.fehlerText)); }
  else if (code) laden(); else zeigeCodeEingabe();
})();
</script>
</body>
</html>
